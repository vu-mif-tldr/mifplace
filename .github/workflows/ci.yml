name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov uploads authenticate with GitHub OIDC, no token secret needed
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:coverage

      # One upload per workspace: all of them report paths as src/..., network_filter tells
      # Codecov which directory they belong to. A failed upload does not fail the check.
      - name: Upload db coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: db/coverage/lcov.info
          flags: db
          network_filter: db/
          disable_search: true

      - name: Upload backend coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: backend/coverage/lcov.info
          flags: backend
          network_filter: backend/
          disable_search: true

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: frontend/coverage/lcov.info
          flags: frontend
          network_filter: frontend/
          disable_search: true

      - name: Upload mcp coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: mcp/coverage/lcov.info
          flags: mcp
          network_filter: mcp/
          disable_search: true

      - name: Upload tools coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: tools/coverage/lcov.info
          flags: tools
          network_filter: tools/
          disable_search: true

      # JUnit reports for Codecov Test Analytics. They run after failed tests too (that is when
      # the report matters), but not after a cancelled run. One upload per workspace with a flag,
      # because all of them name test files as src/...
      - name: Upload db test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: db/test-results/junit.xml
          flags: db
          disable_search: true

      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: backend/test-results/junit.xml
          flags: backend
          disable_search: true

      - name: Upload frontend test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: frontend/test-results/junit.xml
          flags: frontend
          disable_search: true

      - name: Upload mcp test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: mcp/test-results/junit.xml
          flags: mcp
          disable_search: true

      - name: Upload tools test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: tools/test-results/junit.xml
          flags: tools
          disable_search: true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm audit --audit-level=high
