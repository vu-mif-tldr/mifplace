name: Docker image

# Publishes the production image to GitHub Container Registry on every merge to main.
# The server pulls it from there, see deploy/README.md.
# Pull requests only build it, and only when they touch what the image build depends on, so a
# broken Dockerfile shows up before the merge. Code changes are already built by CI.
# workflow_dispatch: rebuild by hand, e.g. for a fresh base image.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - '*/package.json'
      - tsconfig.base.json
      - .github/workflows/docker.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Only main is published: a manual run on another branch just checks that the image builds.
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: the latest build of main. sha-<commit>: a fixed version to roll back to.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The server is x86_64.
          platforms: linux/amd64
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
