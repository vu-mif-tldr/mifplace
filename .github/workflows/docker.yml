name: Docker image

# Publishes the production image to GitHub Container Registry on every merge to main.
# The server pulls it from there, see deploy/README.md.
# Versions are not made here: the "Release" workflow (release.yml) tags an image published here.
# Pull requests only build it, and only when they touch what the image build depends on, so a
# broken Dockerfile shows up before the merge. Code changes are already built by CI.
# workflow_dispatch: rebuild by hand, e.g. for a fresh base image. It replaces main and
# sha-<commit>; tags of a version that is already released keep pointing to the old image.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - '*/package.json'
      - tsconfig.base.json
      - .github/workflows/docker.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs on main wait for each other instead of being cancelled, so a push is never cut off halfway.
# A waiting run can still be replaced by a newer one: that commit then has no sha-<commit> image,
# and the "Release" workflow refuses it (release a later commit instead).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The Node version from .nvmrc and the commit shown on the page and by GET /health
      - name: Read build values
        id: build
        run: |
          echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Only main is published: a manual run on another branch just checks that the image builds.
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: the latest build of main. sha-<commit>: a fixed image to roll back to, and the one the
      # "Release" workflow tags with its version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The server is x86_64.
          platforms: linux/amd64
          build-args: |
            NODE_VERSION=${{ steps.build.outputs.version }}
            APP_COMMIT=${{ steps.build.outputs.commit }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
