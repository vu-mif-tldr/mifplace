# The server gets one CPU and 1 GB, roughly a small VM. The load tool runs in the same Docker VM,
# so that traffic does not go through Docker Desktop's port forwarding and both share one clock.
#
#   docker compose up -d --build server
#   docker compose run --rm --no-deps load --transport ws --viewers 500
#
# scripts/load-matrix.sh runs every transport, each against a fresh server; with PROXY=caddy it
# goes through Caddy with TLS (T6).
#
# Both services use one image, built by `server`: a separate `load` image would not be rebuilt by
# `docker compose build` (its profile is inactive) and would silently run old code.
#
# Server settings from the environment:
#   BATCH_MS            batch interval (100)
#   MAX_BUFFERED_BYTES  unsent data per client before it counts as slow and is dropped (262144)
#   LOG_FILE            e.g. data/events.jsonl: keep the event log across a restart (T4)
#   CADDY_ENCODE        e.g. "encode zstd gzip": compression in Caddy (T6)

services:
  server:
    build: .
    image: realtime-transport-prototype
    command:
      - src/server/main.ts
      - --host=0.0.0.0
      - --batch-ms=${BATCH_MS:-100}
      - --max-buffered-bytes=${MAX_BUFFERED_BYTES:-262144}
      - --log-file=${LOG_FILE:-}
      # T4 ends the process through /api/debug/exit; Docker starts it again.
      - --allow-exit=1
    restart: unless-stopped
    ports:
      - '3100:3100'
    cpus: 1
    mem_limit: 1g
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  # T6: TLS, HTTP/2 and HTTP/3 in front of the server, as in production. https://localhost:8443
  # from the host; the browser has to trust Caddy's local root certificate first.
  caddy:
    image: caddy:2.11.7-alpine
    profiles: [tls]
    depends_on: [server]
    environment:
      CADDY_ENCODE: ${CADDY_ENCODE:-}
    ports:
      - '8443:8443/tcp'
      - '8443:8443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    # Production shares one small VM between Caddy and Node; here each gets one CPU, and the load
    # tool reports Caddy's use separately.
    cpus: 1
    # Generous on purpose: T6 measures how much Caddy needs (about 250 KB per proxied stream).
    mem_limit: 1g
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  load:
    image: realtime-transport-prototype
    pull_policy: never
    profiles: [load]
    depends_on: [server]
    entrypoint:
      - node
      - --experimental-eventsource
      - --disable-warning=UNDICI-ES
      - src/load/main.ts
      - --url
      - http://server:3100
    volumes:
      - ./results:/app/results
      # Caddy's local CA, for NODE_EXTRA_CA_CERTS in T6 runs.
      - caddy-data:/caddy-data:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

volumes:
  caddy-data:
