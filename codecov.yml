# Codecov settings. Reports are uploaded by .github/workflows/ci.yml.
# Checks are informational for now: they show coverage in the pull request but never block merging.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 70%
        informational: true

# Entry points and dev-only scripts: they only wire things together or fill the dev database,
# unit tests do not load them, so they would show 0% and pull the totals down.
ignore:
  - backend/src/server.ts
  - backend/src/scripts/seed-events.ts
  - backend/src/scripts/setup-db.ts
  - frontend/src/main.ts
  - mcp/src/server.ts

flags:
  backend:
    paths:
      - backend/
    # A PR that does not upload a report for a flag keeps the last known numbers instead of zero
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  mcp:
    paths:
      - mcp/
    carryforward: true

comment:
  layout: 'condensed_header, diff, flags, files'
  require_changes: true
