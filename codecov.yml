# Codecov settings. Reports are uploaded by .github/workflows/ci.yml.
# Checks are informational for now: they show coverage in the pull request but never block merging.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 70%
        informational: true

# Entry points, re-exports and dev-only scripts: they only wire things together or fill the dev database,
# unit tests do not load them, so they would show 0% and pull the totals down.
ignore:
  - backend/src/server.ts
  - db/src/index.ts
  - db/src/setup-db.ts
  - shared/src/index.ts
  - frontend/src/main.ts
  - mcp/src/server.ts
  - tools/src/export-palette.ts
  - tools/src/seed-png.ts

flags:
  shared:
    paths:
      - shared/
    # A PR that does not upload a report for a flag keeps the last known numbers instead of zero
    carryforward: true
  db:
    paths:
      - db/
    carryforward: true
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  mcp:
    paths:
      - mcp/
    carryforward: true
  tools:
    paths:
      - tools/
    carryforward: true

# Components split the coverage by part of the system (flags split it by workspace).
# Paths are globs from the repository root; a new file needs to be added to its component here.
component_management:
  default_rules:
    statuses:
      - type: project
        informational: true
  individual_components:
    - component_id: http_api
      name: HTTP API
      paths:
        - backend/src/app.ts
    - component_id: live
      name: Live updates
      # WebSocket server (MP-93), not written yet
      paths:
        - backend/src/live/**
    - component_id: storage
      name: Storage
      paths:
        - db/src/db.ts
        - db/src/env.ts
        - db/src/migrate.ts
        - backend/src/canvas-state.ts
    - component_id: geometry
      name: Canvas geometry
      paths:
        - shared/src/position.ts
    - component_id: frontend_canvas
      name: Canvas UI
      paths:
        - frontend/src/canvas.ts
        - frontend/src/view.ts
        - frontend/src/App.vue
    - component_id: frontend_api
      name: API client
      paths:
        - frontend/src/api.ts
    - component_id: mcp
      name: MCP server
      paths:
        - mcp/src/**
    - component_id: dev_tools
      name: Dev tools
      paths:
        - tools/src/**

comment:
  layout: 'condensed_header, diff, flags, components, files'
  require_changes: true
